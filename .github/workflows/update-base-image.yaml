---
name: Update Base Image

# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types:
      - update

permissions:
  contents: write
  pull-requests: write

jobs:
  update-base-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MATTHIASBALKE_TODO_BOT_APP_ID }}
          private-key: ${{ secrets.MATTHIASBALKE_TODO_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-organization-projects: write

      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract image tag
        id: extract-tag
        env:
          TAGS: ${{ toJson(github.event.client_payload.tags) }}
        run: |
          IMAGE_TAG=$(echo "$TAGS" | jq -r '
            first(.[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
            // first(.[] | select(startswith("sha-")))
            // ""
          ')
          if [ -z "$IMAGE_TAG" ]; then
            echo "No release or sha-* tag found in payload"
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare update branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_TAG: ${{ steps.extract-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          BRANCH_NAME="chore/update-base-image/${IMAGE_TAG}"

          git fetch origin "${BASE_BRANCH}" --depth=1
          git fetch origin \
            "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" \
            --depth=1 || true
          git switch -C "${BRANCH_NAME}" "origin/${BASE_BRANCH}"

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

      - name: Update Dockerfile
        env:
          IMAGE_TAG: ${{ steps.extract-tag.outputs.image_tag }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/matthiasbalke/todo/all-in-one"
          sed -i \
            "s|FROM ${IMAGE_REPOSITORY}:[-.a-zA-Z0-9]*|FROM ${IMAGE_REPOSITORY}:${IMAGE_TAG}|" \
            todo/Dockerfile

      - name: Create pull request and enable auto-merge
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ steps.extract-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          PR_TITLE="chore(app): Update todo to v${IMAGE_TAG}"

          git config user.name "matthiasbalke-todo-bot"
          git config user.email "matthiasbalke-todo-bot@users.noreply.github.com"
          git add todo/Dockerfile

          if git diff --staged --quiet; then
            echo "todo/Dockerfile already uses ${IMAGE_TAG}; no pull request needed."
            exit 0
          fi

          git commit -m "${PR_TITLE}"
          git push --force-with-lease origin "${BRANCH_NAME}"

          PR_NUMBER=$(gh pr list \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH_NAME}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "${PR_NUMBER}" ]; then
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH_NAME}" \
              --title "${PR_TITLE}" \
              --label "maintenance" \
              --project "ToDo" \
              --body "Automated update of the todo base image to ${IMAGE_TAG}."

            PR_NUMBER=$(gh pr list \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH_NAME}" \
              --state open \
              --json number \
              --jq '.[0].number // empty')
          fi

          if [ -z "${PR_NUMBER}" ]; then
            echo "Unable to find or create pull request for ${BRANCH_NAME}"
            exit 1
          fi

          # Repository auto-merge must be enabled and required checks must run for this PR.
          AUTO_MERGE_ENABLED=$(gh pr view "${PR_NUMBER}" \
            --json autoMergeRequest \
            --jq '.autoMergeRequest != null')

          if [ "${AUTO_MERGE_ENABLED}" = "true" ]; then
            echo "Auto-merge is already enabled for PR #${PR_NUMBER}."
          else
            gh pr merge "${PR_NUMBER}" --auto --squash --delete-branch
          fi
